description = "Execute the implementation planning workflow using the plan template to generate design artifacts."

prompt = """
---
description: Execute the implementation planning workflow using the plan template to generate design artifacts.
handoffs: 
  - label: Create Tasks
    agent: speckit.tasks
    prompt: Break the plan into tasks
    send: true
  - label: Create Checklist
    agent: speckit.checklist
    prompt: Create a checklist for the following domain...
---

## User Input

```text
$ARGUMENTS
```

You **MUST** consider the user input before proceeding (if not empty).

## Outline

1. **Setup**: Run `.specify/scripts/bash/setup-plan.sh --json` from repo root and parse JSON for FEATURE_SPEC, IMPL_PLAN, SPECS_DIR, BRANCH. For single quotes in args like "I'm Groot", use escape syntax: e.g 'I'\'\'m Groot' (or double-quote if possible: "I'm Groot").

2. **Load context** (using parallel-extract skill for token efficiency):
   - Read FEATURE_SPEC (full - needed for requirements)
   - **Extract constitution essentials using skill**:
     ```
     const constitutionContext = await Skill("parallel-extract", {
       files: [{
         path: ".specify/memory/constitution.md",
         extract: ["Core Principles", "NON-NEGOTIABLE markers", "Quality Gates", "Testing requirements"],
         maxLines: 40
       }]
     });
     ```
   - Load IMPL_PLAN template (already copied)

**Token Savings**: ~80% vs. loading full constitution

3. **Execute plan workflow**: Follow the structure in IMPL_PLAN template to:
   - Fill Technical Context (mark unknowns as "NEEDS CLARIFICATION")
   - Fill Constitution Check section from agent-extracted principles
   - Evaluate gates (ERROR if violations unjustified)
   - Phase 0: Generate research.md (parallel agents resolve all NEEDS CLARIFICATION)
   - Phase 1: Generate data-model.md, contracts/, quickstart.md (parallel where possible)
   - Phase 1: Update agent context by running the agent script
   - Re-evaluate Constitution Check post-design

4. **Stop and report**: Command ends after Phase 2 planning. Report branch, IMPL_PLAN path, and generated artifacts.

## Phases

### Phase 0: Outline & Research

**Token Optimization Strategy**: Use parallel-research skill for all unknowns.

1. **Extract unknowns from Technical Context**:
   - Identify all "NEEDS CLARIFICATION" markers
   - Group by category: dependencies, integrations, performance targets, constraints

2. **Research all unknowns using parallel-research skill**:

   ```javascript
   const researchResults = await Skill("parallel-research", {
     context: "Extracted from FEATURE_SPEC: [project context and domain]",
     topics: [
       {
         topic: "Authentication/authorization approach",
         focus: ["Security", "User privacy", "Ease of integration"]
       },
       {
         topic: "Database/storage selection",
         focus: ["Scalability", "Cost", "Real-time features"]
       },
       {
         topic: "Testing framework choices",
         focus: ["Integration-first support", "A11y testing", "Learning curve"]
       },
       {
         topic: "Deployment target",
         focus: ["Cost", "Performance", "CI/CD integration"]
       },
       // Add more topics as needed based on NEEDS CLARIFICATION markers
     ],
     model: "haiku"
   });
   ```

   **Skill automatically**:
   - Launches all research tasks in parallel
   - Returns only decision-ready summaries
   - Generates research.md with structured findings
   - Provides implementation complexity for each decision

3. **Use research results to resolve clarifications**:
   - Review research.md generated by skill
   - Confirm decisions or ask for user input if ambiguous
   - Update Technical Context with concrete values
   - Resolve all NEEDS CLARIFICATION markers

**Output**: research.md with all unknowns resolved (via parallel-research skill)

**Token Savings**: ~70-80% reduction vs. manual research or loading full documentation

### Phase 1: Design & Contracts

**Prerequisites:** `research.md` complete

**Token Optimization Strategy**: Parallelize independent artifact generation

1. **Parallel artifact generation** (launch all in single message):

   **Agent A - Data Model** (general-purpose, haiku):
   ```
   Task(
     description="Generate data model",
     prompt="Read FEATURE_SPEC and extract:
            - All entities mentioned (User, Post, Comment, etc.)
            - Fields for each entity from functional requirements
            - Relationships between entities
            - Validation rules
            - State transitions if applicable
            Generate data-model.md in prescribed format.
            Return summary of entities created.",
     subagent_type="general-purpose",
     model="haiku"
   )
   ```

   **Agent B - API Contracts** (general-purpose, haiku):
   ```
   Task(
     description="Generate API contracts",
     prompt="Read FEATURE_SPEC functional requirements and:
            - Map each user action to API endpoint
            - Use REST conventions (GET/POST/PUT/DELETE)
            - Generate OpenAPI 3.0 schema for each endpoint
            - Include request/response examples
            Output to contracts/ directory.
            Return list of endpoints created.",
     subagent_type="general-purpose",
     model="haiku"
   )
   ```

   **Agent C - Quickstart** (general-purpose, haiku):
   ```
   Task(
     description="Generate quickstart guide",
     prompt="Read FEATURE_SPEC user scenarios and:
            - Create step-by-step guide for each scenario
            - Include setup requirements
            - Add testing instructions
            - Keep language non-technical (for stakeholders)
            Generate quickstart.md.
            Return summary of scenarios covered.",
     subagent_type="general-purpose",
     model="haiku"
   )
   ```

2. **Consolidate parallel results**:
   - Verify all agents completed successfully
   - Review generated artifacts for consistency
   - Cross-check that contracts align with data model
   - Ensure quickstart references correct entities/endpoints

3. **Agent context update** (sequential - depends on completion):
   - Run `.specify/scripts/bash/update-agent-context.sh gemini`
   - These scripts detect which AI agent is in use
   - Update the appropriate agent-specific context file
   - Add only new technology from current plan
   - Preserve manual additions between markers

**Output**: data-model.md, /contracts/*, quickstart.md, agent-specific file

**Token Savings**: ~60% reduction by parallel generation with haiku vs. sequential in main context

### Phase 2: Constitution Compliance Check

**Token Optimization Strategy**: Use constitution-check skill for final validation.

After all artifacts are generated, validate constitution compliance:

```javascript
const complianceReport = await Skill("constitution-check", {
  constitution: ".specify/memory/constitution.md",
  artifacts: [
    { path: FEATURE_SPEC, type: "specification" },
    { path: IMPL_PLAN, type: "plan" }
  ],
  mode: "strict"
});
```

**Skill automatically**:
- Checks all NON-NEGOTIABLE principles
- Validates quality gates present
- Returns only violations (compliant items report single line)
- Provides actionable remediation steps

**Actions**:
- If CRITICAL violations found: **ERROR** - Must fix before proceeding to tasks
- If warnings found: Report but allow to proceed
- If compliant: Proceed to Phase 3 (tasks generation)

**Output**: Constitution compliance report with pass/fail status

**Token Savings**: ~80% reduction vs. manual constitution validation

## Auto-Skill Creation

**Enabled when**: `SPECKIT_AUTO_SKILL_CREATION=true` environment variable is set

During execution, if a reusable pattern is detected (used 2+ times), offer to create a skill:

1. **Detect pattern**: Track inline Task() calls and repetitive operations
2. **Propose skill**: When pattern used 2+ times, suggest skill creation:
   ```
   💡 Detected reusable pattern: "Extract entities from data-model.md"

   This pattern has been used 3 times. Would you like to create a skill?

   Proposed skill name: extract-entities
   Estimated token savings: ~60% when used in future features

   Create skill? (yes/no)
   ```

3. **Generate skill** (if user approves):
   - Create `.gemini/skills/extract-entities.md`
   - Include detected pattern as executable prompt
   - Add usage examples from current execution
   - Update skills catalog (README.md)

4. **Update current command**: Replace inline code with Skill() call

5. **Report**: Confirm skill created and available for future use

### Example Auto-Created Skills

From typical speckit usage, these skills might be auto-created:

- `extract-user-stories` - Extract and parse user stories from spec.md
- `generate-contract-tests` - Generate test tasks from API contracts
- `validate-a11y-requirements` - Validate accessibility requirements in spec
- `map-tasks-to-stories` - Map tasks.md entries to user stories

## Key rules

- Use absolute paths
- **Prefer skills over inline code** for all parallel operations
- Use skills for: extraction, research, validation, analysis
- ERROR on gate failures or unresolved clarifications
- ERROR on critical constitution violations
- Track patterns for auto-skill creation (when enabled)
"